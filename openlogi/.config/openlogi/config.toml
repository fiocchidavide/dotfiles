Down = "ShowDesktop"
Left = "PrevTab"
Right = "NextTab"
Click = "ShowActionsRing"

[devices."serial:2546zap2bsm8".bindings.GestureButton.Down]
RunShellCommand = "LANG=en_US.UTF-8 /bin/zsh -c 'source ~/.config/x/x.zsh && x shine down'"

