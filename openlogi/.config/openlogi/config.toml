schema_version = 11

[app_settings]
launch_at_login = true
check_for_updates = true
auto_install_updates = false
update_prompt_seen = true
show_in_menu_bar = true
capture_mouse_events = true
smooth_scroll = false
vertical_scroll_sensitivity = 14
app_icon = "prism"
auto_download_assets = true
asset_source = "automatic"
thumbwheel_sensitivity = 14
appearance = "system"
ui_scale = "normal"
device_view_mode = "grid"
mouse_profile_target = "pointer"
low_battery_notifications = true
lock_key_notifications = true
animate_desktop_switch = true

[app_settings.momentum_scrolling]
enabled = false
pixels_per_notch = 28
glide_shape = "smooth"
max_glide_speed = 8000
glide_ms = 400
repeat_boost = 135

