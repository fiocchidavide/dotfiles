name: lint

on:
  push:
  pull_request:

jobs:
  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax-check all zsh files
        run: |
          set -e
          files=(
            x/.config/x/x.zsh
            x/.config/x/functions/*
            zsh/.myfunctions
            zsh/.zshrc
          )
          for f in "${files[@]}"; do
            echo "zsh -n $f"
            zsh -n "$f"
          done

      - name: Check Makefile parses
        run: make -n help >/dev/null

      - name: Parse-check PowerShell and JSON (windows/)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem windows -Recurse -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { "$($f.Name): $_" }; $bad++ }
          }
          foreach ($f in Get-ChildItem windows -Recurse -Filter *.json) {
            try { Get-Content $f -Raw | ConvertFrom-Json | Out-Null }
            catch { "$($f.Name): $_"; $bad++ }
          }
          exit $bad
