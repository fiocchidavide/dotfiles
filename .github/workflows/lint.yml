name: lint

on:
  push:
  pull_request:

jobs:
  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax-check all zsh files
        run: |
          set -e
          files=(
            x/.config/x/x.zsh
            x/.config/x/functions/*
            x/.config/x/config.zsh.example
            zsh/.myfunctions
            zsh/.zprofile
            zsh/.zshenv
            zsh/.zshrc
            .github/scripts/*.zsh
          )
          for f in "${files[@]}"; do
            echo "zsh -n $f"
            zsh -n "$f"
          done

      # Every command and subcommand: help, errors, completion, and the code
      # agreeing with its Usage block.
      - name: Check every x command is discoverable
        run: zsh -f .github/scripts/discover.zsh

      - name: Syntax-check the Python helper
        run: python3 -m py_compile x/.config/x/lib/xstream.py

      - name: Check Makefile parses
        run: make -n help >/dev/null

  units:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and jq
        run: brew install uv jq

      - name: Unit checks (formatting, x rveil matching, log drawing)
        run: zsh -f .github/scripts/units.zsh
