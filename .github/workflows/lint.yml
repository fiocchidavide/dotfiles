name: lint

on:
  push:
  pull_request:

jobs:
  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax-check all zsh files
        run: |
          set -e
          files=(
            x/.config/x/x.zsh
            x/.config/x/functions/*
            x/.config/x/config.zsh.example
            zsh/.myfunctions
            zsh/.zprofile
            zsh/.zshenv
            zsh/.zshrc
          )
          for f in "${files[@]}"; do
            echo "zsh -n $f"
            zsh -n "$f"
          done

      - name: Syntax-check the share script and Python helper
        run: |
          bash -n x/.config/x/share/open.sh
          python3 -m py_compile x/.config/x/lib/xstream.py

      # open.sh runs on other people's machines (x vault share).
      - name: Shellcheck the share script
        run: shellcheck x/.config/x/share/open.sh

      - name: HKDF self-test (RFC 5869 vectors)
        run: python3 -I x/.config/x/lib/xstream.py selftest

      - name: Check Makefile parses
        run: make -n help >/dev/null

  # x seal / x unseal use BSD stat and tar, so the round trip runs on macOS.
  seal-roundtrip:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install age, zstd, uv and jq
        run: brew install age zstd uv jq

      - name: Seal, verify and unseal a small tree
        run: zsh -f .github/scripts/roundtrip.zsh

      # open.sh fetches its own pinned, checksummed age from GitHub.
      - name: Open a share the way a friend would (open.sh)
        run: zsh -f .github/scripts/open-share.zsh
